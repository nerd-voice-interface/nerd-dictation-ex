[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nerd-dictation-vosk"
version = "0.1.0"
description = "Vosk бэкенд для nerd-dictation-ex (CPU, потоковое распознавание)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
keywords = ["speech-to-text", "vosk", "asr", "russian", "nerd-dictation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "nerd-dictation-ex>=0.1.0",
    "vosk>=0.3.45",
]

[project.optional-dependencies]
# Модели устанавливаются отдельно через скрипт
model-small = []  # ~45MB, быстрая
model-large = []  # ~1.5GB, точная

[project.scripts]
nerd-dictation-vosk-setup = "nerd_dictation_vosk.setup:main"

[project.entry-points."nerd_dictation_ex.backends"]
vosk = "nerd_dictation_vosk:VoskBackend"

[project.urls]
Homepage = "https://github.com/marcusmae/nerd-dictation-ex"
"Vosk Models" = "https://alphacephei.com/vosk/models"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nerd_dictation_vosk" = ["*.md"]
